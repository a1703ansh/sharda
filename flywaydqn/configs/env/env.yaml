# @package _global_
# Gymnasium BeamEnv configuration (spec Section 4.3).
#
# Consumed by `flywaydqn.env.beam_env.load_env_config`. Every key maps to a
# `BeamEnvConfig` field and unknown keys are rejected, so a stale key fails
# loudly instead of being ignored.
carrier_hz: 3.5e9
scenario: UMa
array_rows: 8
array_cols: 8
element_spacing_lambda: 0.5
n_beams_azimuth: 16
n_beams_elevation: 1
azimuth_span_deg: [-60.0, 60.0]
# Power levels are offsets around the 53 dBm operating point the demo twin uses.
# The earlier placeholder list (10-20 dBm) sat ~33 dB below that point, which
# made the power factor a degenerate action: every "low" level destroyed service
# while buying almost no exposure reduction. Keep the top level equal to
# radio.tx_power_dbm so the agent can always choose "full power".
power_levels_dbm: [44.0, 47.0, 50.0, 53.0]
dt_seconds: 0.1
episode_steps: 600
seed: 1

reward:
  alpha: 1.0
  gamma: 0.02
  log10_w_min: -1.0
  log10_w_max: 2.0
  kappa: 5.0
  reward_clip: 10.0

radio:
  bandwidth_mhz: 100.0
  tx_power_dbm: 53.0
  noise_figure_db: 7.0
  interference_dbm: -80.0
  spectral_efficiency_cap: 6.0
  h_bs_m: 25.0
  h_ut_m: 1.5

exposure:
  # Precautionary management threshold, matching what the demo scenarios use
  # (configs/demo/*.yaml). It is ~0.3% of the ICNIRP 2020 general-public
  # reference level for 2-300 GHz (10 W/m^2), which is why it is the default for
  # the RL problem: at the ICNIRP anchor the modelled footprint density sits
  # two-to-three orders of magnitude below the threshold, the softplus penalty is
  # ~0 for every action, and the exposure objective effectively does not exist.
  #
  # This is a configurable operator choice, never asserted as an avian-harm
  # threshold (spec Section 2.2). The threshold sensitivity analysis required by
  # Section 8 (0.01 / 0.1 / 1 mW/cm^2 and the 10 W/m^2 anchor) is still pending.
  s_thr_w_m2: 0.03
  n_cells: 64

episode:
  n_users: 8
  user_min_range_m: 50.0
  user_max_range_m: 400.0
  user_area_m: 500.0
  vehicular_fraction: 0.3
  flock_n_individuals: 40
  flock_min_range_m: 250.0
  flock_max_range_m: 700.0
  flock_speed_ms: 12.0
  flock_speed_spread: 0.2
  flock_altitude_min_m: 20.0
  flock_altitude_max_m: 80.0
  flock_extent_m: 30.0
  flock_recycle_range_m: 900.0

observation:
  users_observed: 8
