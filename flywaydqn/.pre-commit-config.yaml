# Pre-commit hooks. `make setup` runs `pre-commit install` to enable these.
#
# Hook revisions are pinned deliberately. The ruff-pre-commit revision is kept
# inside the ruff range declared in pyproject.toml (`>=0.4,<0.9`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      # Guards against accidentally committing saved browser pages and other
      # large non-source blobs (spec Section 12, correction 1).
      - id: check-added-large-files
        args: [--maxkb=700]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
