[project]
name = "flywaydqn"
version = "1.0.0"
description = "RL controller for 5G massive-MIMO beam/power selection under precautionarily-managed RF exposure over migratory bird flocks."
readme = "README.md"
requires-python = "==3.11.*"
license = "Apache-2.0"
dependencies = [
  "gymnasium>=0.29,<0.31",
  "numpy>=1.26,<2.0",
  "scipy>=1.12,<2.0",
  "torch>=2.3,<2.6",
  "stable-baselines3>=2.3,<3.0",
  "hydra-core>=1.3,<2.0",
  "omegaconf>=2.3,<3.0",
  "pydantic>=2.6,<3.0",
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "mlflow>=2.11,<3.0",
  "optuna>=3.6,<4.0",
  "websocket-client>=1.7,<3.0",
]
[project.optional-dependencies]
dev = [
  "ruff>=0.4,<0.9",
  "mypy>=1.8,<2.0",
  "pytest>=8.1,<10.0",
  "pytest-cov>=5.0,<6.0",
  "types-requests>=2.31,<3.0",
  "pre-commit>=3.6,<4.0",
  "matplotlib>=3.8,<4.0",
]
[project.scripts]
flywaydqn-serve = "flywaydqn.service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["flywaydqn"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["flywaydqn.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flywaydqn --cov-report=term --cov-report=xml"

[tool.coverage.run]
source = ["flywaydqn"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
