# Static host for the built dashboard.
#
# The dashboard calls the API directly at `VITE_API_BASE` (baked in at build
# time; see docker/Dockerfile.ui) instead of tunnelling through a proxy here.
# The service's CORS allowlist is pinned to `http://localhost:5173`
# (flywaydqn/service/app.py, ``_UI_ORIGINS``), which is the origin this
# container is published on in docker/demo-compose.yaml. Keep the published
# port at 5173, or the browser's requests to the API will be refused.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: client-side routes fall back to the shell, and an asset
    # that does not exist is a 404 rather than an HTML body.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
